name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

jobs:
  web-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Unit tests
        run: npm run test

      - name: Web build
        run: npm run build --workspace web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kablus_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/kablus_test
          RUN_DB_MIGRATIONS: "false"
